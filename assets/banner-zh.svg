<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="OpenPM：把一句话想法，编译成可点选批注、可精准回写的活原型工作台">
  <defs>
    <pattern id="bp-grid-zh" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="amber-glow-zh" cx="76%" cy="52%" r="44%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#D97706" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0B0B0D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top-sheen-zh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="card-bg-zh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#17171B"/>
      <stop offset="100%" stop-color="#111114"/>
    </linearGradient>
  </defs>

  <!-- Outer Architectural Frame -->
  <rect x="0.5" y="0.5" width="1199" height="339" rx="16" fill="#0B0B0D" stroke="#26262B" stroke-width="1"/>
  <rect x="1" y="1" width="1198" height="338" rx="15.5" fill="url(#bp-grid-zh)"/>
  <rect x="1" y="1" width="1198" height="338" rx="15.5" fill="url(#amber-glow-zh)"/>
  <line x1="24" y1="1" x2="1176" y2="1" stroke="url(#top-sheen-zh)" stroke-width="1"/>

  <!-- Left Column: Brand & Positioning -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
    <!-- Pill Badge -->
    <rect x="52" y="46" width="286" height="26" rx="13" fill="#D97706" fill-opacity="0.12" stroke="#D97706" stroke-opacity="0.45" stroke-width="1"/>
    <circle cx="68" cy="59" r="3.5" fill="#D97706"/>
    <text x="80" y="63" fill="#F59E0B" font-size="11" font-weight="700" letter-spacing="0.9">OPEN-SOURCE PM WORKBENCH · SPEC-V2</text>

    <!-- Geometric Brand Mark + Wordmark (Swiss Orthogonal Prism) -->
    <g transform="translate(52, 94)">
      <g transform="translate(0, 5) scale(0.046875)">
        <rect x="0" y="0" width="1024" height="1024" rx="224" fill="#16161B" stroke="#2E2E36" stroke-width="26"/>
        <rect x="220" y="232" width="320" height="172" rx="46" fill="none" stroke="#FAFAFA" stroke-width="68"/>
        <path d="M 540 318 L 692 318 L 692 496" fill="none" stroke="#FAFAFA" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="188" y="528" width="264" height="60" rx="30" fill="#71717A"/>
        <rect x="188" y="660" width="184" height="60" rx="30" fill="#3F3F46"/>
        <g transform="translate(692, 692) rotate(45)">
          <rect x="-104" y="-104" width="208" height="208" rx="36" fill="#D97706"/>
          <rect x="-38" y="-38" width="76" height="76" rx="14" fill="#FFFBEB"/>
        </g>
      </g>
      <text x="60" y="44" fill="#FAFAFA" font-size="54" font-weight="800" letter-spacing="-1.8">OpenPM</text>
    </g>

    <!-- 1-Line Sharp Value Prop -->
    <text x="52" y="186" fill="#FAFAFA" font-size="22" font-weight="700" letter-spacing="-0.2">流程 · 原型 · 逻辑说明，一屏联动，不用来回翻</text>
    <text x="52" y="216" fill="#A1A1AA" font-size="12.5" font-weight="400">一句话编译单文件 HTML · 点节点切页 · 点按钮真交互 · 发群点控件写批注 · 一键导出 Word/Wiki</text>

    <!-- Core Value Pills -->
    <g transform="translate(52, 246)" font-size="11.5" font-weight="600">
      <rect x="0" y="0" width="176" height="28" rx="6" fill="#141418" stroke="#27272D" stroke-width="1"/>
      <rect x="10" y="9" width="10" height="10" rx="2" fill="#D97706"/>
      <text x="26" y="18" fill="#FAFAFA">一屏三栏可点击联动</text>

      <rect x="186" y="0" width="184" height="28" rx="6" fill="#141418" stroke="#27272D" stroke-width="1"/>
      <text x="198" y="18" fill="#D4D4D8"><tspan fill="#F59E0B">@[组件]</tspan> 发群点选合并</text>

      <rect x="380" y="0" width="166" height="28" rx="6" fill="#141418" stroke="#27272D" stroke-width="1"/>
      <text x="394" y="18" fill="#D4D4D8">一键导出左图右文文档</text>
    </g>

    <!-- Subtle Co-creator Footnote -->
    <text x="52" y="302" fill="#71717A" font-size="11.5" font-weight="500">
      兼容 Claude Code · Cursor · Codex · Antigravity · WorkBuddy · 灵感源于 @roxorlt / UEmaster
    </text>
  </g>

  <!-- Right Column: Miniature 3-Column Workbench Illustration -->
  <g transform="translate(632, 28)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
    <!-- Workbench Window Shell -->
    <rect x="0" y="0" width="520" height="284" rx="12" fill="url(#card-bg-zh)" stroke="#2E2E36" stroke-width="1.2"/>

    <!-- Window Top Bar -->
    <path d="M 12 0 L 508 0 Q 520 0 520 12 L 520 36 L 0 36 L 0 12 Q 0 0 12 0 Z" fill="#18181D"/>
    <line x1="0" y1="36" x2="520" y2="36" stroke="#27272F" stroke-width="1"/>
    <circle cx="16" cy="18" r="4" fill="#3F3F46"/>
    <circle cx="29" cy="18" r="4" fill="#3F3F46"/>
    <circle cx="42" cy="18" r="4" fill="#3F3F46"/>

    <!-- Mode Switcher in Top Bar -->
    <rect x="160" y="8" width="150" height="20" rx="5" fill="#0F0F12" stroke="#27272F" stroke-width="1"/>
    <text x="175" y="21.5" fill="#71717A" font-size="9.5" font-weight="600">全流程</text>
    <rect x="218" y="10" width="90" height="16" rx="3.5" fill="#27272F"/>
    <text x="236" y="21" fill="#FAFAFA" font-size="9.5" font-weight="600">单页改点</text>

    <!-- Delta Highlight Active Pill -->
    <rect x="414" y="8" width="92" height="20" rx="10" fill="#D97706" fill-opacity="0.18" stroke="#D97706" stroke-width="1"/>
    <circle cx="426" cy="18" r="3" fill="#F59E0B"/>
    <text x="435" y="21.5" fill="#FBBF24" font-size="9.5" font-weight="700">改动高亮 ON</text>

    <!-- Column Dividers -->
    <line x1="126" y1="36" x2="126" y2="284" stroke="#25252D" stroke-width="1"/>
    <line x1="364" y1="36" x2="364" y2="284" stroke="#25252D" stroke-width="1"/>

    <!-- PANE 1: Left Orthogonal TD Flow -->
    <text x="14" y="54" fill="#A1A1AA" font-size="9" font-weight="700" letter-spacing="0.4">① 流程图 · 点节点切页</text>
    <!-- Baseline Node N1 -->
    <rect x="28" y="68" width="70" height="26" rx="4" fill="#F4F4F5" stroke="#A1A1AA" stroke-width="1"/>
    <text x="63" y="84" text-anchor="middle" fill="#27272A" font-size="9" font-weight="600">额度申请页</text>
    <!-- Orthogonal Connector N1 -> D1 -->
    <line x1="63" y1="94" x2="63" y2="114" stroke="#71717A" stroke-width="1.3"/>
    <!-- Decision Diamond D_Quota -->
    <polygon points="63,114 99,134 63,154 27,134" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
    <text x="63" y="137" text-anchor="middle" fill="#92400E" font-size="8.5" font-weight="700">&gt; ¥35,000?</text>
    <!-- Orthogonal Branch Yes -> N2 Delta -->
    <path d="M 63 154 L 63 184" fill="none" stroke="#D97706" stroke-width="1.5"/>
    <text x="72" y="171" fill="#F59E0B" font-size="8" font-weight="700">是</text>
    <!-- Delta Node N2 -->
    <rect x="20" y="184" width="86" height="30" rx="5" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
    <text x="63" y="202" text-anchor="middle" fill="#92400E" font-size="9" font-weight="700">VP 加签复核</text>
    <!-- Unchanged Side Branch No -->
    <path d="M 99 134 L 114 134 L 114 244 L 63 244" fill="none" stroke="#52525B" stroke-width="1.1" stroke-dasharray="2 2"/>
    <rect x="28" y="232" width="70" height="24" rx="4" fill="#27272A" stroke="#52525B" stroke-width="1"/>
    <text x="63" y="247" text-anchor="middle" fill="#A1A1AA" font-size="8.5" font-weight="500">自动放行</text>

    <!-- PANE 2: Center 95% Grayscale Wireframe Canvas -->
    <text x="140" y="54" fill="#A1A1AA" font-size="9" font-weight="700" letter-spacing="0.4">② 可点击原型 · 真交互</text>
    <rect x="140" y="64" width="210" height="150" rx="7" fill="#FAFAFA" stroke="#D4D4D8" stroke-width="1"/>
    <!-- Wireframe Header -->
    <rect x="140" y="64" width="210" height="26" rx="7" fill="#EFEFEF"/>
    <rect x="140" y="82" width="210" height="8" fill="#EFEFEF"/>
    <line x1="140" y1="90" x2="350" y2="90" stroke="#DCDCDC" stroke-width="1"/>
    <text x="152" y="80" fill="#262626" font-size="9.5" font-weight="700">团队月度推理额度加签</text>

    <!-- Grayscale Skeleton Inputs -->
    <text x="152" y="106" fill="#52525B" font-size="8.5" font-weight="600">申请月度上限 (CNY)</text>
    <rect x="152" y="111" width="186" height="22" rx="4" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1"/>
    <text x="160" y="125" fill="#262626" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">¥80,000.00</text>
    <rect x="282" y="115" width="50" height="14" rx="3" fill="#E4E4E7"/>
    <text x="307" y="124.5" text-anchor="middle" fill="#3F3F46" font-size="7.5" font-weight="700">二级风控</text>

    <rect x="152" y="141" width="128" height="7" rx="3.5" fill="#D4D4D8"/>
    <rect x="152" y="153" width="92" height="7" rx="3.5" fill="#E4E4E7"/>

    <!-- Grayscale Secondary Button -->
    <rect x="152" y="175" width="62" height="26" rx="5" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1"/>
    <text x="183" y="191" text-anchor="middle" fill="#424242" font-size="9" font-weight="600">取消</text>

    <!-- Target Anchored Button (Monochrome Fill + 5% #D97706 Focus Ring) -->
    <rect x="220" y="172" width="120" height="32" rx="7" fill="none" stroke="#D97706" stroke-width="1.6" stroke-dasharray="4 2"/>
    <rect x="223" y="175" width="114" height="26" rx="5" fill="#262626"/>
    <text x="280" y="191" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="700">发起 VP 加签审批</text>

    <!-- Floating @[Component] Inline Comment Pill -->
    <g transform="translate(142, 224)">
      <rect x="0" y="0" width="214" height="48" rx="7" fill="#1E1E24" stroke="#D97706" stroke-opacity="0.7" stroke-width="1.2"/>
      <rect x="8" y="8" width="96" height="16" rx="4" fill="#D97706" fill-opacity="0.22" stroke="#D97706" stroke-opacity="0.6" stroke-width="0.8"/>
      <text x="14" y="19" fill="#FBBF24" font-size="8.5" font-weight="700">@[发起 VP 加签审批]</text>
      <text x="110" y="19" fill="#A1A1AA" font-size="8" font-weight="600">前端-王工</text>
      <text x="8" y="37" fill="#E4E4E7" font-size="8.5">超 ¥35k 时需校验必填事由不少于 20 字</text>
    </g>

    <!-- PANE 3: Right Spec Delta Card -->
    <text x="376" y="54" fill="#A1A1AA" font-size="9" font-weight="700" letter-spacing="0.4">③ 逻辑说明 · 连线指认</text>
    <!-- Active Spec Card #1 -->
    <rect x="376" y="68" width="132" height="94" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="384" y="76" width="46" height="14" rx="3" fill="#D97706"/>
    <text x="407" y="85.5" text-anchor="middle" fill="#FFFFFF" font-size="7.5" font-weight="700">本期修改</text>
    <text x="384" y="105" fill="#18181B" font-size="9.5" font-weight="700">大额预算加签拦截</text>
    <text x="384" y="120" fill="#52525B" font-size="8">锚点: btn.vp_signoff</text>
    <text x="384" y="134" fill="#52525B" font-size="8">条件: 月度上限 &gt; ¥35k</text>
    <text x="384" y="148" fill="#92400E" font-size="8" font-weight="700">门禁校验: 0 报错通过</text>

    <!-- Unchanged Spec Card #2 -->
    <rect x="376" y="174" width="132" height="62" rx="6" fill="#202027" stroke="#32323C" stroke-width="1"/>
    <text x="384" y="192" fill="#A1A1AA" font-size="8.5" font-weight="700">常规审计日志归档</text>
    <rect x="384" y="202" width="96" height="6" rx="3" fill="#32323C"/>
    <rect x="384" y="214" width="74" height="6" rx="3" fill="#2A2A33"/>

    <!-- Signature #D97706 Cubic Bezier Tether Connecting Spec Card -> Target Button -->
    <path d="M 376 118 C 350 118, 366 188, 340 188" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="5 3"/>
    <circle cx="376" cy="118" r="3.8" fill="#D97706"/>
    <circle cx="340" cy="188" r="3.8" fill="#D97706"/>
  </g>
</svg>
