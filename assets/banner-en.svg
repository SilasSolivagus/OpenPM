<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="OpenPM: Turn rough product ideas into clickable wireframes, orthogonal flows, and surgical PRDs.">
  <defs>
    <pattern id="bp-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="amber-glow" cx="76%" cy="52%" r="44%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#D97706" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0B0B0D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top-sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#17171B"/>
      <stop offset="100%" stop-color="#111114"/>
    </linearGradient>
  </defs>

  <!-- Outer Architectural Frame -->
  <rect x="0.5" y="0.5" width="1199" height="339" rx="16" fill="#0B0B0D" stroke="#26262B" stroke-width="1"/>
  <rect x="1" y="1" width="1198" height="338" rx="15.5" fill="url(#bp-grid)"/>
  <rect x="1" y="1" width="1198" height="338" rx="15.5" fill="url(#amber-glow)"/>
  <line x1="24" y1="1" x2="1176" y2="1" stroke="url(#top-sheen)" stroke-width="1"/>

  <!-- Left Column: Brand & Positioning -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif">
    <!-- Pill Badge -->
    <rect x="52" y="46" width="286" height="26" rx="13" fill="#D97706" fill-opacity="0.12" stroke="#D97706" stroke-opacity="0.45" stroke-width="1"/>
    <circle cx="68" cy="59" r="3.5" fill="#D97706"/>
    <text x="80" y="63" fill="#F59E0B" font-size="11" font-weight="700" letter-spacing="0.9">OPEN-SOURCE PM WORKBENCH · SPEC-V2</text>

    <!-- Geometric Brand Mark + Wordmark -->
    <g transform="translate(52, 94)">
      <rect x="0" y="6" width="44" height="44" rx="10" fill="#16161A" stroke="#2E2E34" stroke-width="1.2"/>
      <rect x="9" y="15" width="11" height="11" rx="2.5" fill="#E4E4E7"/>
      <rect x="24" y="29" width="11" height="11" rx="2.5" fill="#D97706"/>
      <path d="M 20 20.5 L 29.5 20.5 L 29.5 29" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="20" cy="20.5" r="2" fill="#E4E4E7"/>
      <text x="58" y="44" fill="#FAFAFA" font-size="54" font-weight="800" letter-spacing="-1.8">OpenPM</text>
    </g>

    <!-- 1-Sentence Sharp Value Prop -->
    <text x="52" y="186" fill="#D4D4D8" font-size="18.5" font-weight="500" letter-spacing="-0.2">
      <tspan x="52" dy="0">Turn rough product ideas into clickable wireframes,</tspan>
      <tspan x="52" dy="27">orthogonal flows, and surgical PRDs.</tspan>
    </text>

    <!-- Engineering Invariant Pills -->
    <g transform="translate(52, 246)" font-size="11.5" font-weight="600">
      <rect x="0" y="0" width="208" height="28" rx="6" fill="#141418" stroke="#27272D" stroke-width="1"/>
      <rect x="10" y="9" width="10" height="10" rx="2" fill="#D97706"/>
      <text x="27" y="18" fill="#E4E4E7">95% Gray + 5% #D97706 Delta</text>

      <rect x="216" y="0" width="180" height="28" rx="6" fill="#141418" stroke="#27272D" stroke-width="1"/>
      <text x="228" y="18" fill="#A1A1AA"><tspan fill="#F59E0B">@Component</tspan> Inline Review</text>

      <rect x="404" y="0" width="156" height="28" rx="6" fill="#141418" stroke="#27272D" stroke-width="1"/>
      <text x="417" y="18" fill="#A1A1AA">Zero-Dep Single HTML</text>
    </g>

    <!-- Subtle Co-creator Footnote -->
    <text x="52" y="302" fill="#71717A" font-size="11.5" font-weight="500">
      Works with Claude Code, Cursor, Codex, Antigravity, WorkBuddy · Inspired by @roxorlt / UEmaster
    </text>
  </g>

  <!-- Right Column: Miniature 3-Column Workbench Illustration -->
  <g transform="translate(632, 28)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif">
    <!-- Workbench Window Shell -->
    <rect x="0" y="0" width="520" height="284" rx="12" fill="url(#card-bg)" stroke="#2E2E36" stroke-width="1.2"/>

    <!-- Window Top Bar -->
    <path d="M 12 0 L 508 0 Q 520 0 520 12 L 520 36 L 0 36 L 0 12 Q 0 0 12 0 Z" fill="#18181D"/>
    <line x1="0" y1="36" x2="520" y2="36" stroke="#27272F" stroke-width="1"/>
    <circle cx="16" cy="18" r="4" fill="#3F3F46"/>
    <circle cx="29" cy="18" r="4" fill="#3F3F46"/>
    <circle cx="42" cy="18" r="4" fill="#3F3F46"/>

    <!-- Mode Switcher in Top Bar -->
    <rect x="156" y="8" width="154" height="20" rx="5" fill="#0F0F12" stroke="#27272F" stroke-width="1"/>
    <text x="172" y="21.5" fill="#71717A" font-size="9.5" font-weight="600">Flow</text>
    <rect x="210" y="10" width="98" height="16" rx="3.5" fill="#27272F"/>
    <text x="224" y="21" fill="#FAFAFA" font-size="9.5" font-weight="600">Spec Tether</text>

    <!-- Delta Highlight Active Pill -->
    <rect x="414" y="8" width="92" height="20" rx="10" fill="#D97706" fill-opacity="0.18" stroke="#D97706" stroke-width="1"/>
    <circle cx="426" cy="18" r="3" fill="#F59E0B"/>
    <text x="435" y="21.5" fill="#FBBF24" font-size="9.5" font-weight="700">Delta 5% ON</text>

    <!-- Column Dividers -->
    <line x1="126" y1="36" x2="126" y2="284" stroke="#25252D" stroke-width="1"/>
    <line x1="364" y1="36" x2="364" y2="284" stroke="#25252D" stroke-width="1"/>

    <!-- PANE 1: Left Orthogonal TD Flow -->
    <text x="14" y="54" fill="#71717A" font-size="9" font-weight="700" letter-spacing="0.6">04 · ORTHOGONAL TD</text>
    <!-- Baseline Node N1 -->
    <rect x="28" y="68" width="70" height="26" rx="4" fill="#F4F4F5" stroke="#A1A1AA" stroke-width="1"/>
    <text x="63" y="84" text-anchor="middle" fill="#27272A" font-size="9" font-weight="600">Spend Form</text>
    <!-- Orthogonal Connector N1 -> D1 -->
    <line x1="63" y1="94" x2="63" y2="114" stroke="#71717A" stroke-width="1.3"/>
    <!-- Decision Diamond D_Quota -->
    <polygon points="63,114 97,134 63,154 29,134" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
    <text x="63" y="137" text-anchor="middle" fill="#92400E" font-size="8.5" font-weight="700">&gt; $5,000?</text>
    <!-- Orthogonal Branch Yes -> N2 Delta -->
    <path d="M 63 154 L 63 184" fill="none" stroke="#D97706" stroke-width="1.5"/>
    <text x="72" y="171" fill="#F59E0B" font-size="8" font-weight="700">YES</text>
    <!-- Delta Node N2 -->
    <rect x="20" y="184" width="86" height="30" rx="5" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
    <text x="63" y="202" text-anchor="middle" fill="#92400E" font-size="9" font-weight="700">VP Guardrail</text>
    <!-- Unchanged Side Branch No -->
    <path d="M 97 134 L 114 134 L 114 244 L 63 244" fill="none" stroke="#52525B" stroke-width="1.1" stroke-dasharray="2 2"/>
    <rect x="28" y="232" width="70" height="24" rx="4" fill="#27272A" stroke="#52525B" stroke-width="1"/>
    <text x="63" y="247" text-anchor="middle" fill="#A1A1AA" font-size="8.5" font-weight="500">Auto-Pass</text>

    <!-- PANE 2: Center 95% Grayscale Wireframe Canvas -->
    <text x="140" y="54" fill="#71717A" font-size="9" font-weight="700" letter-spacing="0.6">03 · MONOCHROME WIREFRAME</text>
    <rect x="140" y="64" width="210" height="150" rx="7" fill="#FAFAFA" stroke="#D4D4D8" stroke-width="1"/>
    <!-- Wireframe Header -->
    <rect x="140" y="64" width="210" height="26" rx="7" fill="#EFEFEF"/>
    <rect x="140" y="82" width="210" height="8" fill="#EFEFEF"/>
    <line x1="140" y1="90" x2="350" y2="90" stroke="#DCDCDC" stroke-width="1"/>
    <text x="152" y="80" fill="#262626" font-size="9.5" font-weight="700">Quota Override Request</text>

    <!-- Grayscale Skeleton Inputs -->
    <text x="152" y="106" fill="#52525B" font-size="8.5" font-weight="600">Monthly Cap (USD)</text>
    <rect x="152" y="111" width="186" height="22" rx="4" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1"/>
    <text x="160" y="125" fill="#262626" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">$12,000.00</text>
    <rect x="282" y="115" width="50" height="14" rx="3" fill="#E4E4E7"/>
    <text x="307" y="124.5" text-anchor="middle" fill="#3F3F46" font-size="7.5" font-weight="700">TIER 2</text>

    <rect x="152" y="141" width="128" height="7" rx="3.5" fill="#D4D4D8"/>
    <rect x="152" y="153" width="92" height="7" rx="3.5" fill="#E4E4E7"/>

    <!--Grayscale Secondary Button -->
    <rect x="152" y="175" width="62" height="26" rx="5" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1"/>
    <text x="183" y="191" text-anchor="middle" fill="#424242" font-size="9" font-weight="600">Cancel</text>

    <!-- Target Anchored Button (Monochrome Fill + 5% #D97706 Focus Ring) -->
    <rect x="220" y="172" width="120" height="32" rx="7" fill="none" stroke="#D97706" stroke-width="1.6" stroke-dasharray="4 2"/>
    <rect x="223" y="175" width="114" height="26" rx="5" fill="#262626"/>
    <text x="280" y="191" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="700">Request VP Sign-off</text>

    <!-- Floating @[Component] Inline Comment Pill -->
    <g transform="translate(142, 224)">
      <rect x="0" y="0" width="214" height="48" rx="7" fill="#1E1E24" stroke="#D97706" stroke-opacity="0.7" stroke-width="1.2"/>
      <rect x="8" y="8" width="118" height="16" rx="4" fill="#D97706" fill-opacity="0.22" stroke="#D97706" stroke-opacity="0.6" stroke-width="0.8"/>
      <text x="14" y="19" fill="#FBBF24" font-size="8.5" font-weight="700">@[Request VP Sign-off]</text>
      <text x="132" y="19" fill="#A1A1AA" font-size="8" font-weight="600">Maya · Eng</text>
      <text x="8" y="37" fill="#E4E4E7" font-size="8.5">Require reason when spend &gt; $5k</text>
    </g>

    <!-- PANE 3: Right Spec Delta Card -->
    <text x="376" y="54" fill="#71717A" font-size="9" font-weight="700" letter-spacing="0.6">02 · SPEC DELTA</text>
    <!-- Active Spec Card #1 -->
    <rect x="376" y="68" width="132" height="94" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="384" y="76" width="46" height="14" rx="3" fill="#D97706"/>
    <text x="407" y="85.5" text-anchor="middle" fill="#FFFFFF" font-size="7.5" font-weight="700">MODIFIED</text>
    <text x="384" y="105" fill="#18181B" font-size="9.5" font-weight="700">VP Escalation Rule</text>
    <text x="384" y="120" fill="#52525B" font-size="8">Anchor: btn.vp_signoff</text>
    <text x="384" y="134" fill="#52525B" font-size="8">Gate: cap &gt; $5,000/mo</text>
    <text x="384" y="148" fill="#92400E" font-size="8" font-weight="700">Preflight: Verified</text>

    <!-- Unchanged Spec Card #2 -->
    <rect x="376" y="174" width="132" height="62" rx="6" fill="#202027" stroke="#32323C" stroke-width="1"/>
    <text x="384" y="192" fill="#A1A1AA" font-size="8.5" font-weight="700">Audit Trail Log</text>
    <rect x="384" y="202" width="96" height="6" rx="3" fill="#32323C"/>
    <rect x="384" y="214" width="74" height="6" rx="3" fill="#2A2A33"/>

    <!-- Signature #D97706 Cubic Bezier Tether Connecting Spec Card -> Target Button -->
    <path d="M 376 118 C 350 118, 366 188, 340 188" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="5 3"/>
    <circle cx="376" cy="118" r="3.8" fill="#D97706"/>
    <circle cx="340" cy="188" r="3.8" fill="#D97706"/>
  </g>
</svg>
