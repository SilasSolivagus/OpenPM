<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <pattern id="sp-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="sp-glow" cx="74%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#D97706" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0B0B0D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sp-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181D"/>
      <stop offset="100%" stop-color="#111115"/>
    </linearGradient>
  </defs>

  <!-- Canvas (1280x640 with 132px horizontal GitHub/OG safe-zone margin) -->
  <rect width="1280" height="640" fill="#0B0B0D"/>
  <rect width="1280" height="640" fill="url(#sp-grid)"/>
  <rect width="1280" height="640" fill="url(#sp-glow)"/>
  <g transform="translate(64, 32) scale(0.9)">
  <rect x="28" y="28" width="1224" height="584" rx="20" fill="none" stroke="#24242B" stroke-width="1.5"/>

  <!-- Left Column: Brand + Value Prop -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'PingFang SC', system-ui, sans-serif">
    <!-- Top Pill -->
    <rect x="76" y="88" width="320" height="32" rx="16" fill="#D97706" fill-opacity="0.14" stroke="#D97706" stroke-opacity="0.55" stroke-width="1.2"/>
    <circle cx="96" cy="104" r="4.5" fill="#F59E0B"/>
    <text x="111" y="109" fill="#FBBF24" font-size="12.5" font-weight="700" letter-spacing="1.1">OPEN-SOURCE PM WORKBENCH · MIT</text>

    <!-- Brand Icon + Wordmark (Swiss Orthogonal Prism) -->
    <g transform="translate(76, 152)">
      <g transform="translate(0, 6) scale(0.0664)">
        <rect x="0" y="0" width="1024" height="1024" rx="224" fill="#17171C" stroke="#32323B" stroke-width="24"/>
        <rect x="220" y="232" width="320" height="172" rx="46" fill="none" stroke="#FAFAFA" stroke-width="68"/>
        <path d="M 540 318 L 692 318 L 692 496" fill="none" stroke="#FAFAFA" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="188" y="528" width="264" height="60" rx="30" fill="#71717A"/>
        <rect x="188" y="660" width="184" height="60" rx="30" fill="#3F3F46"/>
        <g transform="translate(692, 692) rotate(45)">
          <rect x="-104" y="-104" width="208" height="208" rx="36" fill="#D97706"/>
          <rect x="-38" y="-38" width="76" height="76" rx="14" fill="#FFFBEB"/>
        </g>
      </g>
      <text x="84" y="62" fill="#FAFAFA" font-size="76" font-weight="800" letter-spacing="-2.4">OpenPM</text>
    </g>

    <!-- Headline -->
    <text x="76" y="286" fill="#F4F4F5" font-size="27" font-weight="700" letter-spacing="-0.4">
      <tspan x="76" dy="0">Flow · Prototype · Logic Specs</tspan>
      <tspan x="76" dy="40" fill="#FBBF24">Linked on One Clickable Screen.</tspan>
    </text>

    <!-- Bilingual Subtitle -->
    <text x="76" y="376" fill="#D4D4D8" font-size="17" font-weight="600">
      流程 · 原型 · 逻辑说明 一屏联动，不用来回翻 · 发群点按钮直接写批注
    </text>

    <!-- Feature Badges -->
    <g transform="translate(76, 424)" font-size="13.5" font-weight="600">
      <rect x="0" y="0" width="242" height="36" rx="8" fill="#15151A" stroke="#2C2C35" stroke-width="1.2"/>
      <rect x="14" y="12" width="12" height="12" rx="2.5" fill="#D97706"/>
      <text x="34" y="23" fill="#FAFAFA">3-in-1 Clickable Screen</text>

      <rect x="252" y="0" width="224" height="36" rx="8" fill="#15151A" stroke="#2C2C35" stroke-width="1.2"/>
      <text x="268" y="23" fill="#D4D4D8"><tspan fill="#FBBF24">@Component</tspan> Chat Review</text>
    </g>
    <g transform="translate(76, 472)" font-size="13.5" font-weight="600">
      <rect x="0" y="0" width="222" height="36" rx="8" fill="#15151A" stroke="#2C2C35" stroke-width="1.2"/>
      <text x="16" y="23" fill="#D4D4D8">1-File Offline HTML · 0-Dep</text>

      <rect x="232" y="0" width="244" height="36" rx="8" fill="#15151A" stroke="#2C2C35" stroke-width="1.2"/>
      <text x="248" y="23" fill="#D4D4D8">1-Click Word · Wiki · WeCom</text>
    </g>

    <!-- Compatibility Footer -->
    <text x="76" y="556" fill="#71717A" font-size="14" font-weight="600">
      Claude Code  ·  Cursor  ·  Codex  ·  Antigravity  ·  WorkBuddy
    </text>
  </g>

  <!-- Right Column: High-Density 3-Pane Workbench Card -->
  <g transform="translate(612, 84)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'PingFang SC', system-ui, sans-serif">
    <rect x="0" y="0" width="592" height="472" rx="14" fill="url(#sp-card)" stroke="#32323C" stroke-width="1.5"/>

    <!-- Window Chrome -->
    <path d="M 14 0 L 578 0 Q 592 0 592 14 L 592 46 L 0 46 L 0 14 Q 0 0 14 0 Z" fill="#1D1D24"/>
    <line x1="0" y1="46" x2="592" y2="46" stroke="#2D2D37" stroke-width="1.2"/>
    <circle cx="20" cy="23" r="5" fill="#3F3F46"/>
    <circle cx="36" cy="23" r="5" fill="#3F3F46"/>
    <circle cx="52" cy="23" r="5" fill="#3F3F46"/>

    <!-- Mode Switcher -->
    <rect x="172" y="10" width="184" height="26" rx="6" fill="#111115" stroke="#2E2E38" stroke-width="1"/>
    <text x="194" y="27" fill="#A1A1AA" font-size="11.5" font-weight="600">Global Flow</text>
    <rect x="268" y="13" width="84" height="20" rx="4" fill="#2E2E38"/>
    <text x="280" y="27" fill="#FAFAFA" font-size="11.5" font-weight="700">Spec Tether</text>

    <!-- Delta Pill -->
    <rect x="466" y="10" width="110" height="26" rx="13" fill="#D97706" fill-opacity="0.2" stroke="#D97706" stroke-width="1.2"/>
    <circle cx="482" cy="23" r="3.8" fill="#F59E0B"/>
    <text x="494" y="27" fill="#FBBF24" font-size="11" font-weight="700">Delta 5% ON</text>

    <!-- Column Dividers -->
    <line x1="154" y1="46" x2="154" y2="472" stroke="#282832" stroke-width="1.2"/>
    <line x1="418" y1="46" x2="418" y2="472" stroke="#282832" stroke-width="1.2"/>

    <!-- Pane 1: Orthogonal TD Flow -->
    <text x="18" y="72" fill="#A1A1AA" font-size="10.5" font-weight="700" letter-spacing="0.7">① FLOWCHART</text>
    <rect x="30" y="92" width="94" height="36" rx="6" fill="#F4F4F5" stroke="#A1A1AA" stroke-width="1.2"/>
    <text x="77" y="114" text-anchor="middle" fill="#18181B" font-size="11" font-weight="700">Usage Dash</text>
    <line x1="77" y1="128" x2="77" y2="162" stroke="#71717A" stroke-width="1.6"/>

    <polygon points="77,162 124,192 77,222 30,192" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
    <text x="77" y="196" text-anchor="middle" fill="#92400E" font-size="10.5" font-weight="800">&gt; $500?</text>

    <line x1="77" y1="222" x2="77" y2="266" stroke="#D97706" stroke-width="2"/>
    <text x="88" y="248" fill="#F59E0B" font-size="10" font-weight="700">YES</text>

    <rect x="24" y="266" width="106" height="40" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <text x="77" y="290" text-anchor="middle" fill="#92400E" font-size="11" font-weight="800">Owner Review</text>

    <path d="M 124 192 L 140 192 L 140 364 L 77 364 L 77 386" fill="none" stroke="#52525B" stroke-width="1.4" stroke-dasharray="3 3"/>
    <rect x="28" y="386" width="98" height="36" rx="6" fill="#23232B" stroke="#52525B" stroke-width="1.2"/>
    <text x="77" y="408" text-anchor="middle" fill="#D4D4D8" font-size="10.5" font-weight="600">Auto-Unlock</text>

    <!-- Pane 2: Monochrome SaaS Wireframe -->
    <text x="172" y="72" fill="#A1A1AA" font-size="10.5" font-weight="700" letter-spacing="0.7">② CLICKABLE PROTOTYPE</text>
    <rect x="170" y="88" width="232" height="264" rx="9" fill="#FAFAFA" stroke="#D4D4D8" stroke-width="1.2"/>
    <rect x="170" y="88" width="232" height="34" rx="9" fill="#EFEFEF"/>
    <rect x="170" y="112" width="232" height="10" fill="#EFEFEF"/>
    <line x1="170" y1="122" x2="402" y2="122" stroke="#DCDCDC" stroke-width="1"/>
    <text x="184" y="110" fill="#18181B" font-size="11.5" font-weight="700">Quota Top-Up Request</text>

    <!-- KPI Mini Strip -->
    <rect x="184" y="134" width="98" height="44" rx="5" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
    <text x="192" y="150" fill="#71717A" font-size="8.5" font-weight="600">MTD SPEND</text>
    <text x="192" y="168" fill="#18181B" font-size="12" font-weight="800">$1,840 / $2k</text>

    <rect x="290" y="134" width="98" height="44" rx="5" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
    <text x="298" y="150" fill="#71717A" font-size="8.5" font-weight="600">AUTO LIMIT</text>
    <text x="298" y="168" fill="#18181B" font-size="12" font-weight="800">&lt;= $500</text>

    <!-- Input with Delta Focus -->
    <text x="184" y="198" fill="#3F3F46" font-size="10" font-weight="700">Requested Extra Budget (USD)</text>
    <rect x="181" y="204" width="210" height="36" rx="7" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8" stroke-dasharray="5 3"/>
    <text x="193" y="227" fill="#18181B" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">$800.00</text>
    <rect x="316" y="212" width="66" height="20" rx="4" fill="#27272A"/>
    <text x="349" y="225.5" text-anchor="middle" fill="#FAFAFA" font-size="9" font-weight="700">OWNER REQ</text>

    <!-- Skeleton Lines & Action Bar -->
    <rect x="184" y="254" width="176" height="8" rx="4" fill="#D4D4D8"/>
    <rect x="184" y="270" width="132" height="8" rx="4" fill="#E4E4E7"/>

    <rect x="184" y="302" width="76" height="32" rx="6" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1"/>
    <text x="222" y="322" text-anchor="middle" fill="#3F3F46" font-size="10.5" font-weight="600">Cancel</text>

    <rect x="268" y="302" width="120" height="32" rx="6" fill="#262626"/>
    <text x="328" y="322" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700">Submit Request</text>

    <!-- Inline @Component Review Card -->
    <g transform="translate(170, 368)">
      <rect x="0" y="0" width="232" height="78" rx="8" fill="#1E1E26" stroke="#D97706" stroke-opacity="0.8" stroke-width="1.4"/>
      <rect x="10" y="10" width="134" height="22" rx="5" fill="#D97706" fill-opacity="0.22" stroke="#D97706" stroke-opacity="0.65" stroke-width="1"/>
      <text x="17" y="25" fill="#FBBF24" font-size="10" font-weight="700">@[Submit Request]</text>
      <text x="152" y="25" fill="#A1A1AA" font-size="9.5" font-weight="600">Alex · FE</text>
      <text x="10" y="48" fill="#F4F4F5" font-size="10.5" font-weight="500">Push Slack/WeCom card when</text>
      <text x="10" y="65" fill="#F4F4F5" font-size="10.5" font-weight="500">amount &gt; $500 routes to Owner</text>
    </g>

    <!-- Pane 3: Spec Tether Card -->
    <text x="432" y="72" fill="#A1A1AA" font-size="10.5" font-weight="700" letter-spacing="0.7">③ LOGIC SPECS</text>
    <rect x="432" y="92" width="144" height="142" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
    <rect x="442" y="104" width="48" height="18" rx="4" fill="#D97706"/>
    <text x="466" y="116.5" text-anchor="middle" fill="#FFFFFF" font-size="9.5" font-weight="800">SC-02</text>
    <text x="442" y="142" fill="#18181B" font-size="11.5" font-weight="800">Tiered Routing</text>
    <text x="442" y="162" fill="#52525B" font-size="9.5">&lt;= $500 Auto-Pass</text>
    <text x="442" y="180" fill="#52525B" font-size="9.5">&gt; $500 Owner Sign</text>
    <text x="442" y="204" fill="#92400E" font-size="9.5" font-weight="700">Gate: 0 Errors</text>

    <rect x="432" y="250" width="144" height="92" rx="8" fill="#202028" stroke="#32323E" stroke-width="1.2"/>
    <text x="442" y="274" fill="#D4D4D8" font-size="10.5" font-weight="700">Wiki Doc Sync</text>
    <text x="442" y="294" fill="#71717A" font-size="9.5">3-Zone .docx + XML</text>
    <rect x="442" y="308" width="108" height="8" rx="4" fill="#32323E"/>

    <!-- Amber Cubic Bezier Tether -->
    <path d="M 432 162 C 402 162, 416 222, 391 222" fill="none" stroke="#D97706" stroke-width="2.4" stroke-dasharray="6 4"/>
    <circle cx="432" cy="162" r="4.5" fill="#D97706"/>
    <circle cx="391" cy="222" r="4.5" fill="#D97706"/>
  </g>
  </g>
</svg>
