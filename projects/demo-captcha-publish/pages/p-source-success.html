<div class="wt-navbar">
  <span>动态社区 · 推荐广场</span>
  <button type="button" class="wt-btn wt-btn-primary wt-btn-sm" data-comp-id="source.new_post.btn" data-comp-name="再次发动态按钮" data-comp-role="control" onclick="goNode('F_EDITOR')">+ 再发一条</button>
</div>

<div class="wt-stack" style="padding:12px;">
  <div class="wt-toast" data-comp-id="common.toast" data-comp-name="全局提示 Toast" data-comp-role="feedback" data-anchor="anchor-toast">
    <span data-when-var="publish_scene" data-when-val="original">发布成功</span>
    <span data-when-var="publish_scene" data-when-val="repost" class="hidden">转发成功</span>
  </div>

  <div class="wt-card">
    <div class="wt-card-hd wt-between">
      <div class="wt-row">
        <span class="wt-avatar">我</span>
        <div class="wt-col" style="gap:1px;">
          <span>当前登录用户（刚刚发布）</span>
          <span class="wt-muted">刚刚 · 公开可见</span>
        </div>
      </div>
      <span class="wt-badge">最新动态</span>
    </div>
    <div class="wt-card-bd wt-stack">
      <p data-when-var="publish_scene" data-when-val="original">#周末徒步路线 分享今天实测的山脊环线轨迹，全程 11 公里爬升温和，水源补给点清晰。</p>
      <div data-when-var="publish_scene" data-when-val="repost" class="wt-stack hidden">
        <p>附议这份轻量化清单，保温水壶和头灯确实必不可少！</p>
        <div class="wt-alert">
          <span class="wt-muted">@林晓：今天整理的秋季近郊徒步装备清单，轻量化背包控制在 6kg 以内体验舒适很多……</span>
        </div>
      </div>
    </div>
    <div class="wt-card-ft wt-between">
      <span class="wt-muted">原发布接口确认成功并已刷新时间线</span>
      <span class="wt-muted">当日验证失败计数：0</span>
    </div>
  </div>
</div>
