<svg class="flow-svg" viewBox="0 0 760 880" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#555555" />
    </marker>
  </defs>

  <!-- Edges -->
  <polyline points="320,84 320,130" fill="none" stroke="#555555" stroke-width="1.8" data-from="F_LIST" data-to="F_FORM" marker-end="url(#arrow)" />
  <polyline points="320,194 320,240" fill="none" stroke="#555555" stroke-width="1.8" data-from="F_FORM" data-to="D_AMOUNT_50K" marker-end="url(#arrow)" />

  <!-- Branch from D_AMOUNT_50K -->
  <polyline points="240,285 160,285 160,360" fill="none" stroke="#555555" stroke-width="1.8" data-from="D_AMOUNT_50K" data-to="F_LEADER" data-branch="le_50k" marker-end="url(#arrow)" />
  <text x="170" y="276" font-size="11" fill="#555555">≤ 5万（单级）</text>

  <polyline points="400,285 480,285 480,360" fill="none" stroke="#555555" stroke-width="1.8" data-from="D_AMOUNT_50K" data-to="F_FINANCE" data-branch="gt_50k" marker-end="url(#arrow)" />
  <text x="412" y="276" font-size="11" fill="#555555">&gt; 5万（加签复核）</text>

  <!-- Leader to Finance (when > 50k) or directly to D_AUDIT_OK -->
  <polyline points="245,392 395,392" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="4 3" data-from="F_LEADER" data-to="F_FINANCE" marker-end="url(#arrow)" />
  <text x="275" y="384" font-size="10.5" fill="#888888">初审通过后流转</text>

  <polyline points="160,424 160,505 240,545" fill="none" stroke="#555555" stroke-width="1.8" data-from="F_LEADER" data-to="D_AUDIT_OK" marker-end="url(#arrow)" />
  <polyline points="480,424 480,505 400,545" fill="none" stroke="#555555" stroke-width="1.8" data-from="F_FINANCE" data-to="D_AUDIT_OK" marker-end="url(#arrow)" />

  <!-- Branch from D_AUDIT_OK -->
  <polyline points="240,545 160,545 160,640" fill="none" stroke="#555555" stroke-width="1.8" data-from="D_AUDIT_OK" data-to="F_DONE" data-branch="approve" marker-end="url(#arrow)" />
  <text x="168" y="536" font-size="11" fill="#555555">通过</text>

  <polyline points="400,545 480,545 480,640" fill="none" stroke="#dc2626" stroke-width="1.8" data-from="D_AUDIT_OK" data-to="F_REJECTED" data-branch="reject" marker-end="url(#arrow)" />
  <text x="420" y="536" font-size="11" fill="#dc2626">驳回（保留草稿）</text>

  <!-- Re-edit loop from F_REJECTED back to F_FORM -->
  <polyline points="565,672 650,672 650,162 415,162" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="5 3" data-from="F_REJECTED" data-to="F_FORM" marker-end="url(#arrow)" />
  <text x="656" y="420" font-size="11" fill="#2563eb" writing-mode="tb">驳回重提（重新编辑）</text>

  <!-- Nodes -->
  <g class="flow-node" data-node="F_LIST" data-node-type="start" role="button" tabindex="0">
    <rect x="230" y="20" width="180" height="64" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1.8" />
    <text x="320" y="48" text-anchor="middle" font-size="13" font-weight="700" fill="#333333">采购申请列表</text>
    <text x="320" y="67" text-anchor="middle" font-size="11" fill="#888888">F_LIST · p-apply-list</text>
  </g>

  <g class="flow-node" data-node="F_FORM" data-node-type="process" role="button" tabindex="0">
    <rect x="225" y="130" width="190" height="64" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1.8" />
    <text x="320" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#333333">新建/编辑采购申请单</text>
    <text x="320" y="177" text-anchor="middle" font-size="11" fill="#888888">F_FORM · p-apply-form</text>
  </g>

  <g class="flow-node flow-decision" data-node="D_AMOUNT_50K" data-node-type="decision" role="button" tabindex="0">
    <polygon points="320,240 400,285 320,330 240,285" fill="#ffffff" stroke="#555555" stroke-width="1.8" />
    <text x="320" y="289" text-anchor="middle" font-size="12.5" font-weight="700" fill="#333333">金额 &gt; 5万？</text>
  </g>

  <g class="flow-node" data-node="F_LEADER" data-node-type="process" role="button" tabindex="0">
    <rect x="75" y="360" width="170" height="64" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1.8" />
    <text x="160" y="388" text-anchor="middle" font-size="13" font-weight="700" fill="#333333">直属主管审批</text>
    <text x="160" y="407" text-anchor="middle" font-size="11" fill="#888888">F_LEADER · p-leader-audit</text>
  </g>

  <g class="flow-node" data-node="F_FINANCE" data-node-type="process" role="button" tabindex="0">
    <rect x="395" y="360" width="170" height="64" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1.8" />
    <text x="480" y="388" text-anchor="middle" font-size="13" font-weight="700" fill="#333333">财务总监复核</text>
    <text x="480" y="407" text-anchor="middle" font-size="11" fill="#888888">F_FINANCE · p-finance-audit</text>
  </g>

  <g class="flow-node flow-decision" data-node="D_AUDIT_OK" data-node-type="decision" role="button" tabindex="0">
    <polygon points="320,500 400,545 320,590 240,545" fill="#ffffff" stroke="#555555" stroke-width="1.8" />
    <text x="320" y="549" text-anchor="middle" font-size="12.5" font-weight="700" fill="#333333">审批是否通过？</text>
  </g>

  <g class="flow-node" data-node="F_DONE" data-node-type="end" role="button" tabindex="0">
    <rect x="75" y="640" width="170" height="64" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1.8" />
    <text x="160" y="668" text-anchor="middle" font-size="13" font-weight="700" fill="#333333">审批通过结果页</text>
    <text x="160" y="687" text-anchor="middle" font-size="11" fill="#888888">F_DONE · p-audit-done</text>
  </g>

  <g class="flow-node" data-node="F_REJECTED" data-node-type="end" role="button" tabindex="0">
    <rect x="395" y="640" width="170" height="64" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.8" />
    <text x="480" y="668" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">驳回保留草稿页</text>
    <text x="480" y="687" text-anchor="middle" font-size="11" fill="#888888">F_REJECTED · p-audit-rejected</text>
  </g>
</svg>
