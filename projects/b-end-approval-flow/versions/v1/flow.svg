<svg id="flowsvg" data-flowspec="1" viewBox="0 0 820 920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#555555" />
    </marker>
  </defs>

  <!-- Main Vertical Spine Edges -->
  <polyline points="360,84 360,128" fill="none" stroke="#555555" stroke-width="1.8" data-from="F_LIST" data-to="F_FORM" marker-end="url(#arrow)" />
  <polyline points="360,188 360,232" fill="none" stroke="#555555" stroke-width="1.8" data-from="F_FORM" data-to="F_LEADER" marker-end="url(#arrow)" />
  <polyline points="360,292 360,336" fill="none" stroke="#555555" stroke-width="1.8" data-from="F_LEADER" data-to="D_AUDIT_LEADER" marker-end="url(#arrow)" />

  <!-- Branches from D_AUDIT_LEADER -->
  <polyline points="360,424 360,476" fill="none" stroke="#555555" stroke-width="1.8" data-from="D_AUDIT_LEADER" data-to="D_AMOUNT_50K" data-branch="approve" marker-end="url(#arrow)" />
  <text x="370" y="454" font-size="11" fill="#555555">主管同意</text>

  <polyline points="448,380 610,380 610,820" fill="none" stroke="#555555" stroke-width="1.8" data-from="D_AUDIT_LEADER" data-to="F_REJECTED" data-branch="reject" marker-end="url(#arrow)" />
  <text x="462" y="372" font-size="11" fill="#888888">主管驳回（保留草稿）</text>

  <!-- Branches from D_AMOUNT_50K -->
  <polyline points="272,520 135,520 135,820" fill="none" stroke="#555555" stroke-width="1.8" data-from="D_AMOUNT_50K" data-to="F_DONE" data-branch="le_50k" marker-end="url(#arrow)" />
  <text x="145" y="512" font-size="11" fill="#555555">≤ 5万（单级办结）</text>

  <polyline points="360,564 360,616" fill="none" stroke="#555555" stroke-width="1.8" data-from="D_AMOUNT_50K" data-to="F_FINANCE" data-branch="gt_50k" marker-end="url(#arrow)" />
  <text x="370" y="594" font-size="11" fill="#555555">&gt; 5万（加签复核）</text>

  <!-- F_FINANCE to D_AUDIT_OK -->
  <polyline points="360,676 360,720" fill="none" stroke="#555555" stroke-width="1.8" data-from="F_FINANCE" data-to="D_AUDIT_OK" marker-end="url(#arrow)" />

  <!-- Branches from D_AUDIT_OK -->
  <polyline points="272,764 195,764 195,820" fill="none" stroke="#555555" stroke-width="1.8" data-from="D_AUDIT_OK" data-to="F_DONE" data-branch="approve" marker-end="url(#arrow)" />
  <text x="205" y="756" font-size="11" fill="#555555">复核通过</text>

  <polyline points="448,764 550,764 550,820" fill="none" stroke="#555555" stroke-width="1.8" data-from="D_AUDIT_OK" data-to="F_REJECTED" data-branch="reject" marker-end="url(#arrow)" />
  <text x="458" y="756" font-size="11" fill="#888888">复核驳回</text>

  <!-- Re-edit Loop from F_REJECTED back to F_FORM -->
  <polyline points="675,850 740,850 740,158 460,158" fill="none" stroke="#555555" stroke-width="1.6" stroke-dasharray="5 3" data-from="F_REJECTED" data-to="F_FORM" marker-end="url(#arrow)" />
  <text x="752" y="504" font-size="11" fill="#888888" writing-mode="tb">驳回重提（重新编辑）</text>

  <!-- Nodes -->
  <g class="flow-node" data-node="F_LIST" data-node-type="start" role="button" tabindex="0">
    <rect x="265" y="24" width="190" height="60" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1.8" />
    <text x="360" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="#333333">采购申请列表</text>
    <text x="360" y="69" text-anchor="middle" font-size="11" fill="#888888">F_LIST · p-apply-list</text>
  </g>

  <g class="flow-node" data-node="F_FORM" data-node-type="process" role="button" tabindex="0">
    <rect x="260" y="128" width="200" height="60" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1.8" />
    <text x="360" y="154" text-anchor="middle" font-size="13" font-weight="700" fill="#333333">新建/编辑采购申请单</text>
    <text x="360" y="173" text-anchor="middle" font-size="11" fill="#888888">F_FORM · p-apply-form</text>
  </g>

  <g class="flow-node" data-node="F_LEADER" data-node-type="process" role="button" tabindex="0">
    <rect x="265" y="232" width="190" height="60" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1.8" />
    <text x="360" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#333333">直属主管初审</text>
    <text x="360" y="277" text-anchor="middle" font-size="11" fill="#888888">F_LEADER · p-leader-audit</text>
  </g>

  <g class="flow-node flow-decision" data-node="D_AUDIT_LEADER" data-node-type="decision" role="button" tabindex="0">
    <polygon points="360,336 448,380 360,424 272,380" fill="#ededed" stroke="#555555" stroke-width="1.8" />
    <text x="360" y="384" text-anchor="middle" font-size="12" font-weight="700" fill="#333333">主管是否同意？</text>
  </g>

  <g class="flow-node flow-decision" data-node="D_AMOUNT_50K" data-node-type="decision" role="button" tabindex="0">
    <polygon points="360,476 448,520 360,564 272,520" fill="#ededed" stroke="#555555" stroke-width="1.8" />
    <text x="360" y="524" text-anchor="middle" font-size="12" font-weight="700" fill="#333333">金额 &gt; 5万？</text>
  </g>

  <g class="flow-node" data-node="F_FINANCE" data-node-type="process" role="button" tabindex="0">
    <rect x="265" y="616" width="190" height="60" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1.8" />
    <text x="360" y="642" text-anchor="middle" font-size="13" font-weight="700" fill="#333333">财务总监复核</text>
    <text x="360" y="661" text-anchor="middle" font-size="11" fill="#888888">F_FINANCE · p-finance-audit</text>
  </g>

  <g class="flow-node flow-decision" data-node="D_AUDIT_OK" data-node-type="decision" role="button" tabindex="0">
    <polygon points="360,720 448,764 360,808 272,764" fill="#ededed" stroke="#555555" stroke-width="1.8" />
    <text x="360" y="768" text-anchor="middle" font-size="12" font-weight="700" fill="#333333">复核是否通过？</text>
  </g>

  <g class="flow-node" data-node="F_DONE" data-node-type="end" role="button" tabindex="0">
    <rect x="70" y="820" width="190" height="60" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1.8" />
    <text x="165" y="846" text-anchor="middle" font-size="13" font-weight="700" fill="#333333">审批通过结果页</text>
    <text x="165" y="865" text-anchor="middle" font-size="11" fill="#888888">F_DONE · p-audit-done</text>
  </g>

  <g class="flow-node" data-node="F_REJECTED" data-node-type="end" role="button" tabindex="0">
    <rect x="485" y="820" width="190" height="60" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1.8" />
    <text x="580" y="846" text-anchor="middle" font-size="13" font-weight="700" fill="#333333">驳回保留草稿页</text>
    <text x="580" y="865" text-anchor="middle" font-size="11" fill="#888888">F_REJECTED · p-audit-rejected</text>
  </g>
</svg>
