<div id="p-apply-list" class="page" data-page="p-apply-list" data-page-id="p-apply-list">
  <div class="wt-navbar">
    <div class="wt-breadcrumb">
      <span>企业管理后台</span><span>/</span><span>采购管理</span><span>/</span><strong>采购申请列表</strong>
    </div>
    <button class="wt-btn wt-btn-primary wt-btn-sm" data-comp-id="list.new.btn" data-comp-name="新建采购单按钮">+ 新建采购单</button>
  </div>

  <div class="wt-stack" style="padding:14px;">
    <div class="wt-between">
      <div class="wt-row">
        <select class="wt-select" style="width:160px;" data-comp-id="list.filter.select" data-comp-name="审批状态筛选器">
          <option value="all">全部状态</option>
          <option value="pending_leader">待直属主管审批</option>
          <option value="pending_finance">待财务总监复核</option>
          <option value="approved">已通过</option>
          <option value="rejected_draft">已驳回（草稿保留）</option>
        </select>
        <input class="wt-input" style="width:200px;" type="text" placeholder="搜索采购单号或事由" data-comp-id="list.search.input" data-comp-name="采购单搜索框" />
      </div>
      <span class="wt-muted">共 3 条采购单记录</span>
    </div>

    <div class="wt-card">
      <div class="wt-card-bd" style="padding:0;">
        <table class="wt-table">
          <thead>
            <tr>
              <th>采购单号</th>
              <th>采购事由</th>
              <th>采购金额</th>
              <th>当前状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>PO-20261120-01</td>
              <td>研发团队年度云主机续费</td>
              <td>¥ 86,000</td>
              <td><span class="wt-tag">待财务总监复核</span></td>
              <td><button class="wt-btn wt-btn-sm" data-comp-id="list.row1.view.btn" data-comp-name="查看大额采购单详情按钮">查看</button></td>
            </tr>
            <tr>
              <td>PO-20261119-08</td>
              <td>办公区人体工学椅补充采购</td>
              <td>¥ 24,500</td>
              <td><span class="wt-tag">已驳回（草稿保留）</span></td>
              <td><button class="wt-btn wt-btn-primary wt-btn-sm" data-comp-id="list.row2.reedit.btn" data-comp-name="驳回重提编辑按钮">重新编辑</button></td>
            </tr>
            <tr>
              <td>PO-20261118-03</td>
              <td>设计部字体授权续约</td>
              <td>¥ 12,000</td>
              <td><span class="wt-tag">已通过</span></td>
              <td><button class="wt-btn wt-btn-sm" data-comp-id="list.row3.view.btn" data-comp-name="查看已通过采购单详情按钮">查看</button></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
