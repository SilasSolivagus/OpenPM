<div id="p-leader-audit" class="page" data-page="p-leader-audit" data-page-id="p-leader-audit">
  <div class="wt-navbar">
    <div class="wt-breadcrumb">
      <span>审批中心</span><span>/</span><span>待我审批</span><span>/</span><strong>直属主管初审</strong>
    </div>
    <span class="wt-tag">当前节点：直属主管初审</span>
  </div>

  <div class="wt-stack" style="padding:14px;">
    <div class="wt-card">
      <div class="wt-card-hd wt-between">
        <span>采购单摘要（PO-20261120-02）</span>
        <span class="wt-muted">申请人：张明（基础架构部）</span>
      </div>
      <div class="wt-card-bd wt-stack">
        <div class="wt-between">
          <span class="wt-muted">申请金额与后续流向</span>
          <strong data-when-var="amount_tier" data-when-val="gt_50k">¥ 65,000.00（&gt; 5 万元，同意后加签财务总监复核）</strong>
          <strong data-when-var="amount_tier" data-when-val="le_50k" class="hidden">¥ 24,500.00（≤ 5 万元，同意后单级审批直接办结）</strong>
        </div>
        <div class="wt-divider"></div>
        <div class="wt-col">
          <span class="wt-muted">采购事由</span>
          <span>Q4 核心业务集群算力扩容采购（3台服务器节点，含年度维保服务）</span>
        </div>
      </div>
    </div>

    <div class="wt-modal" style="width:100%; max-width:none;" data-comp-id="audit.modal" data-comp-name="直属主管审批弹窗" data-comp-role="modal">
      <div class="wt-modal-hd">
        <span>直属主管审批意见弹窗</span>
        <button type="button" class="wt-btn wt-btn-ghost wt-btn-sm" data-comp-id="audit.close.btn" data-comp-name="关闭审批弹窗按钮" data-comp-role="control" onclick="goNode('F_LIST')">✕</button>
      </div>
      <div class="wt-modal-bd wt-stack">
        <div class="wt-field">
          <label class="wt-label">审批备注（驳回时建议填写修改要求）</label>
          <textarea class="wt-textarea" placeholder="请输入同意或驳回的审批说明" data-comp-id="audit.comment.input" data-comp-name="直属主管审批备注输入框" data-comp-role="control">已核对供应商报价单附件，业务需求真实合理。</textarea>
        </div>
      </div>
      <div class="wt-modal-ft">
        <button type="button" class="wt-btn wt-btn-danger" data-comp-id="audit.reject.btn" data-comp-name="直属主管驳回按钮" data-comp-role="control" onclick="setVar('leader_decision','reject');goNode('F_REJECTED')">驳回（保留草稿）</button>
        <button type="button" class="wt-btn wt-btn-primary" data-comp-id="audit.approve.btn" data-comp-name="直属主管同意按钮" data-comp-role="control" onclick="setVar('leader_decision','approve');goBranch('amount_tier')">同意</button>
      </div>
    </div>
  </div>
</div>
