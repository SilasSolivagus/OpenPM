<div id="p-audit-done" class="page" data-page="p-audit-done" data-page-id="p-audit-done">
  <div class="wt-navbar">
    <div class="wt-breadcrumb">
      <span>采购管理</span><span>/</span><span>审批结果</span><span>/</span><strong>审批已通过</strong>
    </div>
    <span class="wt-tag">流程已完成</span>
  </div>

  <div class="wt-stack" style="padding:14px;">
    <div class="wt-card">
      <div class="wt-card-hd wt-between">
        <span>采购单审批通过</span>
        <span class="wt-badge">单号：PO-20261120-02</span>
      </div>
      <div class="wt-card-bd wt-stack">
        <div class="wt-alert">
          <strong>审批完成：</strong>当前采购单已通过全部必要审批节点，系统已自动生成采购执行编号。
        </div>
        <div class="wt-between">
          <span class="wt-muted">最终状态</span>
          <strong>已通过（可执行采购）</strong>
        </div>
        <div class="wt-between">
          <span class="wt-muted">审批轨迹</span>
          <span data-when-var="amount_tier" data-when-val="gt_50k">申请人提交 → 直属主管初审同意 → 财务总监复核通过</span>
          <span data-when-var="amount_tier" data-when-val="le_50k" class="hidden">申请人提交 → 直属主管初审同意（≤ 5 万单级办结）</span>
        </div>
      </div>
      <div class="wt-card-ft wt-between">
        <button type="button" class="wt-btn" data-comp-id="done.back_list.btn" data-comp-name="返回采购申请列表按钮" data-comp-role="nav" onclick="goNode('F_LIST')">返回采购列表</button>
        <button type="button" class="wt-btn wt-btn-primary" data-comp-id="done.new_order.btn" data-comp-name="继续新建采购单按钮" data-comp-role="control" onclick="goNode('F_FORM')">继续新建采购单</button>
      </div>
    </div>
  </div>
</div>
